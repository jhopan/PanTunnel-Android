name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > pantunnel.jks
            cat > keystore.properties <<EOF
          storeFile=pantunnel.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: pantunnel-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release creation is intentionally NOT done here. Releases are published manually
      # with the real keystore (backup/keystore). When CI also published, every tag produced
      # two releases and the CI one was signed with the debug key — buyers then failed to
      # update. CI only builds, tests and uploads artifacts.
